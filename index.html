<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sector 7 (EXL7D)</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <style>
    :root{
      --glass: rgba(10, 10, 14, 0.55);
      --stroke: rgba(255,255,255,0.18);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.75);
      --shadow: 0 18px 50px rgba(0,0,0,0.55);
      --blur: 10px;
      --ring: 260px; /* radius for the floating tabs */
    }

    *{ box-sizing: border-box; }
    html, body{ height: 100%; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; color: var(--text); }
    body{
      background: #000;
      overflow-x: hidden;
    }

    /* Background image */
    .bg{
      position: fixed; inset: 0;
      background: url("assets/bg.jpg") center/cover no-repeat fixed;
      transform: scale(1.02);
      filter: saturate(1.05) contrast(1.05);
    }
    /* Dark overlay + subtle vignette for readability */
    .bg::after{
      content:"";
      position:absolute; inset:0;
      background:
        radial-gradient(ellipse at center, rgba(0,0,0,0.20), rgba(0,0,0,0.75)),
        linear-gradient(to bottom, rgba(0,0,0,0.35), rgba(0,0,0,0.65));
    }

    /* Main layout */
    .wrap{
      position: relative;
      min-height: 100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 24px;
    }

    .stage{
      position: relative;
      width: min(880px, 92vw);
      height: min(680px, 80vh);
      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* Center card */
    .center{
      position: relative;
      width: min(420px, 86vw);
      padding: 22px 22px 18px;
      border-radius: 22px;
      background: var(--glass);
      border: 1px solid var(--stroke);
      backdrop-filter: blur(var(--blur));
      box-shadow: var(--shadow);
      text-align:center;
    }

    .crest{
      width: 170px;
      height: 170px;
      object-fit: contain;
      display:block;
      margin: 0 auto 12px;
      filter: drop-shadow(0 14px 30px rgba(0,0,0,0.55));
    }

    h1{
      margin: 6px 0 2px;
      font-size: 34px;
      letter-spacing: 0.04em;
    }
    .tag{
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    /* Floating tabs arranged around the center */
    .orbit{
      position: absolute;
      inset: 0;
      pointer-events: none; /* allow only buttons to receive clicks */
    }

    .tab{
      pointer-events: auto;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      text-decoration: none;
      color: var(--text);
      padding: 12px 14px;
      min-width: 160px;
      text-align: center;
      border-radius: 999px;
      background: rgba(15,15,22,0.55);
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(var(--blur));
      box-shadow: 0 10px 28px rgba(0,0,0,0.45);
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
      user-select: none;
    }
    .tab:hover{
      background: rgba(20,20,30,0.70);
      border-color: rgba(255,255,255,0.28);
      transform: translate(-50%, -50%) scale(1.04);
    }

    /* Positions: 5 around a circle */
    .t1{ transform: translate(-50%, -50%) translate(calc(var(--ring) * 0),    calc(var(--ring) * -1)); } /* top */
    .t2{ transform: translate(-50%, -50%) translate(calc(var(--ring) * 0.95), calc(var(--ring) * -0.10)); } /* upper-right */
    .t3{ transform: translate(-50%, -50%) translate(calc(var(--ring) * 0.58), calc(var(--ring) * 0.86)); }  /* lower-right */
    .t4{ transform: translate(-50%, -50%) translate(calc(var(--ring) * -0.58),calc(var(--ring) * 0.86)); }  /* lower-left */
    .t5{ transform: translate(-50%, -50%) translate(calc(var(--ring) * -0.95),calc(var(--ring) * -0.10)); } /* upper-left */

    /* Footer mini */
    .footer{
      position: fixed;
      left: 0; right: 0; bottom: 10px;
      display:flex;
      justify-content:center;
      font-size: 12px;
      color: rgba(255,255,255,0.65);
      text-shadow: 0 2px 10px rgba(0,0,0,0.65);
      padding: 0 14px;
      text-align:center;
      pointer-events:none;
    }

    /* Mobile: stack tabs under the center */
    @media (max-width: 720px){
      :root{ --ring: 0px; }
      .stage{ height: auto; padding: 60px 0 90px; }
      .orbit{ position: static; inset: auto; width: 100%; margin-top: 16px; pointer-events: auto; }
      .tab{
        position: static;
        transform: none !important;
        display:block;
        margin: 10px auto;
        width: min(360px, 92vw);
      }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <main class="wrap">
    <section class="stage">
      <div class="center" role="banner">
        <img class="crest" src="assets/crest.png" alt="Sector 7 crest" />
        <h1>SECTOR 7</h1>
        <p class="tag">EXL7D • FFXIV Free Company</p>
      </div>

      <div class="orbit" aria-label="Navigation">
        <!-- EDIT THESE: labels + href links -->
        <a class="tab t1" href="https://example.com" target="_blank" rel="noopener">Recruitment</a>
        <a class="tab t2" href="https://example.com" target="_blank" rel="noopener">Discord</a>
        <a class="tab t3" href="https://example.com" target="_blank" rel="noopener">Events</a>
        <a class="tab t4" href="https://example.com" target="_blank" rel="noopener">Gallery</a>
        <a class="tab t5" href="https://example.com" target="_blank" rel="noopener">Contact</a>
      </div>
    </section>
  </main>

  <div class="footer">
    © <span id="y"></span> Sector 7 (EXL7D) • Unofficial fan site
  </div>

  <script>
    document.getElementById("y").textContent = new Date().getFullYear();
  </script>
</body>
</html>
